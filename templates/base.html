<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MailChess{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* This fixes the email display in Dark Mode */
        .dark .email-content-inverter {
            filter: invert(1) hue-rotate(180deg);
        }
        .dark .email-content-inverter img {
            filter: invert(1) hue-rotate(180deg);
        }
        
        /* Smooth transition for theme switching */
        html, body { transition: background-color 0.3s, color 0.3s; }
    </style>

    {% block extra_css %}{% endblock %}

    <script>
        // IMMEDIATE THEME CHECK: Runs before content loads
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800 min-h-screen text-gray-800 dark:text-gray-100 flex flex-col">

    <nav class="p-4 bg-white/90 shadow-sm dark:bg-gray-900/90 transition-colors duration-200">
        <div class="container mx-auto flex justify-between items-center">
            <ul class="flex gap-6">
                <li>
                    <a href="{{ url_for('mail.inbox') }}" class="text-gray-800 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 font-bold flex items-center">
                        <i class="fas fa-home mr-2"></i> Indbakke
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('stats.index') }}" class="text-gray-800 dark:text-gray-200 hover:text-indigo-600 dark:hover:text-indigo-400 font-bold flex items-center">
                        <i class="fas fa-chart-pie mr-2"></i> Statistik
                    </a>
                </li>
            </ul>

            <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-yellow-300 transition-colors shadow-sm">
                <i id="navThemeIcon" class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            // Update the icon in the Navbar
            const navIcon = document.getElementById('navThemeIcon');
            const isDark = document.documentElement.classList.contains('dark');
            
            if (navIcon) {
                navIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }

            // Update icon in the Inbox Toolbar (if it exists)
            const toolbarIcon = document.getElementById('themeIcon');
            if (toolbarIcon) {
                toolbarIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
